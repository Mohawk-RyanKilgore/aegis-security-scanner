[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-security-scanner"
version = "3.0.0"
description = "Multi-language security scanner for Python, JavaScript, C/C++, Dockerfiles, Terraform, Kubernetes, and more"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["security", "scanner", "sast", "vulnerability", "python", "javascript", "terraform", "kubernetes", "docker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "bandit>=1.7.0",
]

[project.optional-dependencies]
pdf = ["reportlab>=3.6.0"]
git = ["gitpython>=3.1.0"]
full = ["reportlab>=3.6.0", "gitpython>=3.1.0"]

[project.scripts]
aegis = "aegis:main"

[project.urls]
Homepage = "https://github.com/Mohawk-RyanKilgore/aegis-security-scanner"
"Bug Tracker" = "https://github.com/Mohawk-RyanKilgore/aegis-security-scanner/issues"
Documentation = "https://github.com/Mohawk-RyanKilgore/aegis-security-scanner#readme"

[tool.setuptools]
py-modules = ["aegis"]
